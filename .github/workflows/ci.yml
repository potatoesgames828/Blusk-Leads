name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: blusk_owner
          POSTGRES_PASSWORD: blusk
          POSTGRES_DB: blusk_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://blusk_owner:blusk@localhost:5432/blusk_test
      E2E_DATABASE_URL: postgres://blusk_owner:blusk@localhost:5432/blusk_e2e
      DATABASE_URL: postgres://blusk_owner:blusk@localhost:5432/blusk_test
      LEAD_PROVIDER: fake
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: PGPASSWORD=blusk psql -h localhost -U blusk_owner -d blusk_test -c "create database blusk_e2e"
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
